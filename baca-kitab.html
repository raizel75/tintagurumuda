    <!-- SCRIPT SUPABASE & RENDER -->
    <script>
      // Konfigurasi Supabase
      const SUPABASE_URL = "https://isvbsjjpcqbryifmcesu.supabase.co";
      const SUPABASE_ANON_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzdmJzampwY3FicnlpZm1jZXN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1Mzc0NzcsImV4cCI6MjA5MzExMzQ3N30.SfuoWBRVar9ntsxV_3513Y62EF7lEZukQ3DwGchpYMg";
      const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      // Variabel Global
      let currentFasalId = new URLSearchParams(window.location.search).get(
        "fasal_id",
      );
      let fasalData, bagianData, kitabData;
      let allFasalInBagian = [];
      let baseArabicSize = 1.85; // Menyesuaikan ukuran font awal agar tombol zoom responsif
      let baseIndoSize = 1; // dalam rem

      // Status Fitur Tema
      const themes = ["light", "sepia", "dark"];
      const themeLabels = ["Terang", "Sepia", "Gelap"];
      let currentTheme = localStorage.getItem("tiguda_theme") || "light";

      const contentContainer = document.getElementById("content-container");
      const loader = document.getElementById("global-loader");

      async function initPage() {
        try {
          applyTheme(currentTheme);

          // MODE TESTING
          if (!currentFasalId) {
            const { data: testFasal, error: errTest } = await supabaseClient
              .from("fasal")
              .select("id")
              .limit(1)
              .single();
            if (testFasal) currentFasalId = testFasal.id;
            else
              throw new Error("Database kosong. Tidak ada Fasal untuk dibaca.");
          }

          // 1. Ambil Info Fasal
          const { data: fasal, error: errFasal } = await supabaseClient
            .from("fasal")
            .select("*")
            .eq("id", currentFasalId)
            .single();
          if (errFasal) throw errFasal;
          fasalData = fasal;

          // 2. Ambil Info Bagian & Kitab
          const { data: bagian } = await supabaseClient
            .from("bagian")
            .select("*")
            .eq("id", fasal.bagian_id)
            .single();
          bagianData = bagian;

          if (bagian) {
            const { data: kitab } = await supabaseClient
              .from("kitab")
              .select("*")
              .eq("id", bagian.kitab_id)
              .single();
            kitabData = kitab;

            // 3. Ambil Semua Fasal di Bagian ini (untuk navigasi & Drawer)
            const { data: fasals } = await supabaseClient
              .from("fasal")
              .select("id, nama_fasal, urutan")
              .eq("bagian_id", bagian.id)
              .order("urutan");
            allFasalInBagian = fasals || [];
          }

          // 4. Update Header & Navigasi
          updateHeaderUI();
          updateBottomNavigation();
          renderDrawerDaftarIsi();

          // 5. Ambil Isi Teks Kitab (Paragraf)
          const { data: listIsi, error: errIsi } = await supabaseClient
            .from("isi_kitab")
            .select("*")
            .eq("fasal_id", currentFasalId)
            .order("urutan");
          if (errIsi) throw errIsi;

          if (!listIsi || listIsi.length === 0) {
            contentContainer.innerHTML = `
              <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm transition-colors">
                <svg class="w-16 h-16 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                <h3 class="text-lg font-bold text-slate-600">Teks Belum Tersedia</h3>
                <p class="text-slate-400 text-sm mt-1">Admin belum memasukkan isi untuk fasal ini.</p>
              </div>`;
            return;
          }

          // 6. Ambil Mufrodat
          const isiIds = listIsi.map((i) => i.id);
          const { data: allMufrodat } = await supabaseClient
            .from("mufrodat")
            .select("*")
            .in("isi_kitab_id", isiIds)
            .order("urutan_kata");

          // 7. Render Konten
          renderKonten(listIsi, allMufrodat || []);
        } catch (error) {
          console.error(error);
          contentContainer.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-xl border border-red-200 text-center font-bold">Terjadi kesalahan: ${error.message}</div>`;
        } finally {
          loader.classList.add("opacity-0");
          setTimeout(() => loader.classList.add("hidden"), 300);
        }
      }

      function updateHeaderUI() {
        const titleKitab = kitabData ? kitabData.nama : "Unknown Kitab";
        const titleBagian = bagianData ? bagianData.nama_bagian : "";

        document.getElementById("bread-kitab").textContent =
          `${titleKitab} ${titleBagian ? "• " + titleBagian : ""}`;
        document.getElementById("judul-fasal").textContent =
          fasalData.nama_fasal;

        const judulArabHeader = document.getElementById("judul-arab");
        const judulArabNavbar = document.getElementById("navbar-judul-arab");

        if (fasalData.nama_arab) {
          judulArabHeader.textContent = fasalData.nama_arab;
          judulArabHeader.style.display = "block";
          if (judulArabNavbar)
            judulArabNavbar.textContent = fasalData.nama_arab;
        } else {
          judulArabHeader.style.display = "none";
          if (judulArabNavbar) judulArabNavbar.textContent = "";
        }

        if (bagianData) {
          document.getElementById("btn-back").href =
            `daftar-isi.html?bagian_id=${bagianData.id}`;
        }
      }

      function renderKonten(listIsi, allMufrodat) {
        let html = "";

        listIsi.forEach((isi, index) => {
          // 1. Teks Arab Interaktif (Mufrodat)
          const mufrodatParagraph = allMufrodat.filter(
            (m) => m.isi_kitab_id === isi.id,
          );
          let htmlTeksArab = "";

          if (mufrodatParagraph.length > 0) {
            htmlTeksArab = `<div class="font-arabic text-emerald-900 text-right leading-loose mb-2 transition-colors flex flex-wrap gap-x-2.5 gap-y-1 justify-start" dir="rtl">`;
            mufrodatParagraph.forEach((m) => {
              // Bersihkan kutipan agar tidak merusak HTML
              const safeArti = (m.arti || "").replace(/"/g, "&quot;");
              const safeTarkib = (m.tarkib || "").replace(/"/g, "&quot;");

              htmlTeksArab += `<span onclick="showMufrodatPopup(this)" data-kata="${m.kata_arab}" data-arti="${safeArti}" data-tarkib="${safeTarkib}" class="kata-clickable">${m.kata_arab}</span>`;
            });
            htmlTeksArab += `</div>`;
          } else {
            // Fallback jika admin belum memecah kata
            htmlTeksArab = `<div class="font-arabic text-emerald-900 text-right leading-loose mb-2 select-text transition-colors" dir="rtl">${isi.teks_arab}</div>`;
          }

          // 2. Terjemahan Utama
          const htmlTerjemah = isi.teks_indo
            ? `<div class="mt-5 px-4 border-l-4 border-slate-300 font-indo text-slate-700 transition-colors">${isi.teks_indo}</div>`
            : "";

          // 3. Tombol & Konten Syarah
          let htmlPenjelasan = "";
          if (isi.penjelasan) {
            htmlPenjelasan = `
              <div class="mt-4 pt-3 border-t border-slate-100">
                <button onclick="toggleSyarah(${isi.id})" id="btn-syarah-${isi.id}" class="inline-flex items-center gap-1.5 text-[11px] font-bold text-emerald-600 hover:text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition-colors border border-emerald-100">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                  <span>Lihat Syarah</span>
                </button>
                <div id="syarah-${isi.id}" class="hidden mt-3 bg-emerald-50/50 rounded-xl p-4 sm:p-5 border border-emerald-100 font-indo transition-all duration-300">
                  <h4 class="text-xs font-bold text-emerald-700 uppercase tracking-widest mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 
                    Syarah / Penjelasan
                  </h4>
                  <p class="text-slate-600 text-sm leading-relaxed">${isi.penjelasan}</p>
                </div>
              </div>
             `;
          }

          // Penggabungan Paragraf
          html += `
            <div class="bg-white p-5 sm:p-8 rounded-2xl shadow-sm border border-slate-200 relative transition-colors duration-300">
              <div class="absolute -top-3 -left-3 w-8 h-8 bg-slate-900 text-white rounded-full flex items-center justify-center font-bold text-xs shadow-md border-4 border-white transition-colors">${index + 1}</div>
              ${htmlTeksArab}
              ${htmlTerjemah}
              ${htmlPenjelasan}
            </div>
          `;
        });

        contentContainer.innerHTML = html;
      }

      // ---------------------------------------------------------
      // FUNGSI POP-UP MUFRODAT (BOTTOM SHEET DESIGN)
      // ---------------------------------------------------------
      function showMufrodatPopup(el) {
        const kata = el.getAttribute("data-kata");
        const arti = el.getAttribute("data-arti") || "-";
        const tarkib = el.getAttribute("data-tarkib") || "-";

        document.getElementById("popup-kata").textContent = kata;
        document.getElementById("popup-arti").textContent = arti;

        const tarkibContainer = document.getElementById(
          "popup-tarkib-container",
        );
        const artiContainer = document.getElementById("popup-arti-container");

        // Logika agar grid tetap sejajar: [ Arti | Tarkib ]
        if (tarkib && tarkib !== "-") {
          document.getElementById("popup-tarkib").textContent = tarkib;
          tarkibContainer.classList.remove("hidden");
          artiContainer.classList.add("border-r", "border-slate-100", "pr-2");
          artiContainer.classList.remove("col-span-2");
        } else {
          tarkibContainer.classList.add("hidden");
          artiContainer.classList.remove(
            "border-r",
            "border-slate-100",
            "pr-2",
          );
          artiContainer.classList.add("col-span-2"); // Jika tarkib tak ada, arti memenuhi baris
        }

        const popup = document.getElementById("mufrodat-popup");
        const overlay = document.getElementById("mufrodat-overlay");
        const panel = document.getElementById("mufrodat-panel");

        popup.classList.remove("hidden");
        popup.classList.add("flex");

        // Animasi Slide-up (Bottom Sheet)
        setTimeout(() => {
          overlay.classList.remove("opacity-0");
          panel.classList.remove("opacity-0", "translate-y-full");
          panel.classList.add("opacity-100", "translate-y-0");
        }, 10);
      }

      function closeMufrodatPopup() {
        const popup = document.getElementById("mufrodat-popup");
        const overlay = document.getElementById("mufrodat-overlay");
        const panel = document.getElementById("mufrodat-panel");

        // Balikkan animasi Slide-down
        overlay.classList.add("opacity-0");
        panel.classList.remove("opacity-100", "translate-y-0");
        panel.classList.add("opacity-0", "translate-y-full");

        setTimeout(() => {
          popup.classList.add("hidden");
          popup.classList.remove("flex");
        }, 300); // Sinkron durasi transisi
      }

      // ---------------------------------------------------------
      // FUNGSI KONTROL TEMA & SYARAH LOKAL
      // ---------------------------------------------------------
      function toggleSyarah(id) {
        const syarahDiv = document.getElementById(`syarah-${id}`);
        const btn = document.getElementById(`btn-syarah-${id}`);

        if (syarahDiv.classList.contains("hidden")) {
          syarahDiv.classList.remove("hidden");
          btn.innerHTML = `
             <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
             <span>Tutup Syarah</span>
           `;
        } else {
          syarahDiv.classList.add("hidden");
          btn.innerHTML = `
             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
             <span>Lihat Syarah</span>
           `;
        }
      }

      function cycleTheme() {
        let idx = themes.indexOf(currentTheme);
        idx = (idx + 1) % themes.length;
        currentTheme = themes[idx];
        localStorage.setItem("tiguda_theme", currentTheme);
        applyTheme(currentTheme);
      }

      function applyTheme(themeName) {
        document.body.classList.remove("theme-sepia", "theme-dark");

        if (themeName !== "light") {
          document.body.classList.add(`theme-${themeName}`);
        }

        const teksTema = document.getElementById("teks-tema");
        if (teksTema) {
          teksTema.textContent = themeLabels[themes.indexOf(themeName)];
        }
      }

      // ---------------------------------------------------------
      // FUNGSI NAVIGASI BAWAH & DRAWER
      // ---------------------------------------------------------
      function updateBottomNavigation() {
        if (allFasalInBagian.length === 0) return;

        const currentIndex = allFasalInBagian.findIndex(
          (f) => f.id == currentFasalId,
        );
        const btnPrev = document.getElementById("btn-prev");
        const btnNext = document.getElementById("btn-next");

        if (currentIndex > 0) {
          const prevFasal = allFasalInBagian[currentIndex - 1];
          btnPrev.href = `?fasal_id=${prevFasal.id}`;
          btnPrev.classList.remove("opacity-50", "pointer-events-none");
        }

        if (currentIndex < allFasalInBagian.length - 1) {
          const nextFasal = allFasalInBagian[currentIndex + 1];
          btnNext.href = `?fasal_id=${nextFasal.id}`;
          btnNext.classList.remove("opacity-50", "pointer-events-none");
          btnNext.classList.add("text-emerald-600");
        }
      }

      function renderDrawerDaftarIsi() {
        const drawerList = document.getElementById("drawer-list-fasal");
        let html = '<div class="space-y-2 pb-6">';

        allFasalInBagian.forEach((f, idx) => {
          const isActive = f.id == currentFasalId;
          html += `
            <a href="?fasal_id=${f.id}" class="flex items-center gap-3 p-3 rounded-xl border transition-all ${isActive ? "bg-emerald-50 border-emerald-200 shadow-sm" : "bg-white border-slate-100 hover:border-emerald-200"}">
              <div class="w-7 h-7 rounded flex items-center justify-center text-xs font-bold shrink-0 ${isActive ? "bg-emerald-500 text-white" : "bg-slate-100 text-slate-500"}">${idx + 1}</div>
              <span class="font-semibold text-sm ${isActive ? "text-emerald-700" : "text-slate-600"} line-clamp-2">${f.nama_fasal}</span>
            </a>
          `;
        });
        html += "</div>";
        drawerList.innerHTML = html;
      }

      function openDaftarIsiDrawer() {
        const drawer = document.getElementById("drawer-daftar-isi");
        const panel = document.getElementById("drawer-panel");
        const overlay = document.getElementById("drawer-overlay");

        drawer.classList.remove("hidden");
        void drawer.offsetWidth;

        panel.classList.remove("-translate-x-full");
        overlay.classList.remove("opacity-0");
        document.body.style.overflow = "hidden";
      }

      function closeDaftarIsiDrawer() {
        const panel = document.getElementById("drawer-panel");
        const overlay = document.getElementById("drawer-overlay");

        panel.classList.add("-translate-x-full");
        overlay.classList.add("opacity-0");

        setTimeout(() => {
          document.getElementById("drawer-daftar-isi").classList.add("hidden");
          document.body.style.overflow = "auto";
        }, 300);
      }

      // ---------------------------------------------------------
      // FUNGSI UKURAN FONT
      // ---------------------------------------------------------
      function changeFontSize(step) {
        if (step > 0 && baseArabicSize > 4) return;
        if (step < 0 && baseArabicSize < 1.5) return;

        baseArabicSize += step * 0.25;
        baseIndoSize += step * 0.1;

        document.documentElement.style.setProperty(
          "--arabic-size",
          `${baseArabicSize}rem`,
        );
        document.documentElement.style.setProperty(
          "--indo-size",
          `${baseIndoSize}rem`,
        );
      }

      // Mulai saat halaman dirender
      window.onload = initPage;
    </script>
  </body>
</html>
